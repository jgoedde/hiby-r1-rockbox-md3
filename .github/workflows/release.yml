name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: pip install -r requirements.txt
      # version for the file headers comes from GITHUB_REF_NAME (the tag)
      - run: python tools/generate.py
      - name: Zip variants
        run: |
          for dir in dist/*/; do
            name=$(basename "$dir")
            (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/$name-$GITHUB_REF_NAME.zip" .rockbox)
          done
          ls -l *.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-rc* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" *.zip --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}"
